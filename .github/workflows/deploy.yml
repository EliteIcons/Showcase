name: Build and Deploy Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Showcase
        uses: actions/checkout@v4

      - name: Checkout EliteIcons Library
        uses: actions/checkout@v4
        with:
          repository: EliteIcons/EliteIcons.github.io
          path: elite-icons-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build elite-icons-react Package
        run: |
          cd elite-icons-source
          pnpm install --no-frozen-lockfile
          pnpm generate
          pnpm --dir packages/elite-icons-react build

      - name: Install Showcase Dependencies & Build
        run: |
          npm install --no-audit --no-fund ./elite-icons-source/packages/elite-icons-react
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
